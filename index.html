    label(value,.81,y,.036,mono,weight,'right');
    ctx.fillStyle = '#1c1a1f50';
    ctx.fillRect(W*.19,H*(y+.009),W*.62,1);
  });
  label('INGREDIENTS',.15,.62,.044,mono,500);
  let line = '', lineY = .649;
  ctx.font = (.034*W)+'px '+mono;
  for (const word of flavor.list.split(' ')) {
    if (ctx.measureText(line+' '+word).width > W*.7) {
      label(line,.15,lineY,.034);
      line = '';
      lineY += .022;
    }
    line += (line ? ' ' : '')+word;
  }
  label(line,.15,lineY,.034);

  panel(.25,.735,.50,.091,.021);
  const random = rng(15395+i*203);
  for (let x = .285*W; x < .715*W;) {
    const width = 1+Math.floor(random()*4);
    ctx.fillStyle = ink;
    ctx.fillRect(x,H*.746,width,H*.05);
    x += width+1+Math.floor(random()*3);
  }
  label('8  50327  9031'+i+'  2',.5,.814,.027,mono,400,'center');
  label('PRESSED, NOT BAKED',.5,.885,.042,mono,500,'center');
  return canvas;
}

async function initWebGL() {
  const canvas = $('#gl');
  const loadedFonts = Promise.all([
    document.fonts.load('400 100px "Archivo Black"'),
    document.fonts.load('400 22px "DM Mono"'),
    document.fonts.load('500 22px "DM Mono"'),
    document.fonts.load('700 22px Inter'),
  ]).then(() => { sizeTitle(); updateNavHighlight(); });
  try {
    const [THREE,{RoomEnvironment},image] = await Promise.all([
      import('three'), import('three/addons/environments/RoomEnvironment.js'), loadSheet(), loadedFonts,
    ]);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.setClearColor(0x000000,0);
    const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera();
    const pmrem = new THREE.PMREMGenerator(renderer), room = new RoomEnvironment();
    scene.environment = pmrem.fromScene(room,.04).texture;
    room.dispose();
    pmrem.dispose();
    scene.add(new THREE.AmbientLight(0xffffff,.55));
    const key = new THREE.DirectionalLight(0xffffff,1.1);
    key.position.set(-.6,.9,1.4);
    scene.add(key);

    const geometry = [wrapperGeometry(THREE,1),wrapperGeometry(THREE,-1)];
    const textures = flavors.map((flavor,i) => [false,true].map(back => {
      const texture = new THREE.CanvasTexture(artwork(image,flavor,i,back));
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = 8;
      return texture;
    }));
    const shadowCanvas = document.createElement('canvas');
    shadowCanvas.width = shadowCanvas.height = 128;
    const ctx = shadowCanvas.getContext('2d');
    const radial = ctx.createRadialGradient(64,64,3,64,64,64);
    radial.addColorStop(0,'rgba(30,18,40,.55)');
    radial.addColorStop(1,'rgba(30,18,40,0)');
    ctx.fillStyle = radial;
    ctx.fillRect(0,0,128,128);
    const shadowMap = new THREE.CanvasTexture(shadowCanvas);
    shadowMap.colorSpace = THREE.SRGBColorSpace;
    const shadowGeometry = new THREE.PlaneGeometry(1.25,1.04*barRatio);
    const makeBar = () => {
      const group = new THREE.Group();
      group.rotation.order = 'ZYX';
      const surfaces = geometry.map((geo,i) => {
        const mesh = new THREE.Mesh(geo,new THREE.MeshPhysicalMaterial({
          map:textures[1][i], transparent:true, alphaTest:.5, roughness:.45, metalness:0, clearcoat:.5,
          clearcoatRoughness:.32, envMapIntensity:.42,
        }));
        group.add(mesh);
        return mesh;
      });
      const shadow = new THREE.Mesh(shadowGeometry,new THREE.MeshBasicMaterial({
        map:shadowMap, transparent:true, depthWrite:false,
      }));
      shadow.renderOrder = -1;
      scene.add(group,shadow);
      return { group, surfaces, shadow, index: 1, j: undefined };
    };
    const pool = Array.from({length:11},makeBar), traveler = makeBar();
    const ray = new THREE.Raycaster(), pointer = new THREE.Vector2();
    const place = (obj,entry) => {
      const {group,surfaces,shadow} = obj;
      group.visible = shadow.visible = !!entry && entry.state.op > .01;
      obj.j = entry?.j;
      if (!group.visible) return;
      const {j,state:s} = entry, i = wrap(j), scale = s.h/barRatio;
      group.position.set(s.x-vw/2,vh/2-s.y,s.z);
      group.rotation.set(s.rx*degrees,s.ry*degrees,-s.rz*degrees,'ZYX');
      group.scale.set(scale*s.sx,scale*s.sy,scale);
      shadow.position.set(group.position.x,group.position.y-.05*s.h,s.z-.32*s.h);
      shadow.rotation.z = group.rotation.z;
      shadow.scale.set(scale*Math.max(.3,Math.abs(Math.cos(group.rotation.y))),scale,1);
      shadow.material.opacity = .5*s.op*s.shadow;
      for (const [side,mesh] of surfaces.entries()) {
        if (obj.index !== i) mesh.material.map = textures[i][side];
        mesh.material.opacity = s.op;
        mesh.material.alphaTest = .5*s.op;
      }
      obj.index = i;
    };
    gl = {
      resize() {
        renderer.setPixelRatio(Math.min(devicePixelRatio,phone ? 1.75 : 2));
        renderer.setSize(vw,vh,false);
        camera.position.set(0,0,cameraD);
        camera.fov = 2*Math.atan(vh/2/cameraD)/degrees;
        camera.aspect = vw/vh;
        camera.near = 10;
        camera.far = 4*cameraD;
        camera.updateProjectionMatrix();
        camera.updateMatrixWorld();
      },
      draw(states,visible) {
        const t = states.at(-1);
        const first = Math.floor(pos)-5;
        pool.forEach((obj,i) => place(obj,states.find(entry => entry !== t && entry.j === first+i)));
        place(traveler,t);
        if (visible || !canvas.hidden) renderer.render(scene,camera);
        canvas.hidden = !visible;
      },
      hit(x,y) {
        pointer.set(2*x/vw-1,1-2*y/vh);
        ray.setFromCamera(pointer,camera);
        const meshes = [...pool,traveler].filter(obj => obj.group.visible).flatMap(obj => {
          for (const mesh of obj.surfaces) mesh.userData.j = obj.j;
          return obj.surfaces;
        });
        return ray.intersectObjects(meshes)[0]?.object.userData.j;
      },
    };
    flat.hidden = true;
    document.body.classList.add('gl');
    gl.resize();
    canvas.addEventListener('webglcontextlost',event => {
      event.preventDefault();
      gl = null;
      canvas.hidden = true;
      flat.hidden = false;
      document.body.classList.remove('gl');
    }, { once:true });
    canvas.addEventListener('webglcontextrestored',initWebGL,{ once:true });
  } catch (error) {
    console.warn('Stride is using its flat wrapper preview.',error);
  }
}
document.body.classList.add('travel');
initWebGL();
</script>
</body>
